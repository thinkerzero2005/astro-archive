name: Bug 报告
description: 报告可复现的问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        提交前请先搜索是否已有相同 Issue。请勿粘贴真实素材库路径、照片文件名等个人信息。
  - type: input
    id: version
    attributes:
      label: 软件版本
      description: 设置页「软件信息」中的版本号，例如 v0.3.1
      placeholder: v0.3.1
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: 系统环境
      description: Windows 版本与位数
      placeholder: Windows 11 23H2 x64
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 从启动开始的完整操作步骤
      placeholder: |
        1. 打开……
        2. 点击……
        3. 出现……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 如有报错信息请完整粘贴
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 截图、日志、素材规模等（请先脱敏）
    validations:
      required: false
