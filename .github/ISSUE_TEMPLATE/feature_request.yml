name: 功能建议
description: 提出新功能或改进想法
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 描述当前使用中的不便或缺失的能力
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的方案
      description: 你希望软件如何工作
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 考虑过的其他做法
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: 补充信息
      description: 使用场景、素材规模等
    validations:
      required: false
